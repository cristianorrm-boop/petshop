<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico — carrossel "Em promoção"</title>
  <!-- Ferramenta avulsa de diagnóstico (não faz parte do site): refaz, passo a passo, os
       mesmos cálculos que v2-js/store.js faz pra decidir se mostra o carrossel "Em promoção"
       na página inicial, e mostra cada resultado na tela. Serve pra achar, sem precisar abrir
       o Console do navegador (F12), em qual passo a conta dá um resultado diferente do
       esperado — sem isso, só sobra "não apareceu" sem saber se é config, produto ou um erro
       de JavaScript no meio do caminho. -->
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; padding: 24px; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.3rem; color: #D4A017; margin-bottom: 4px; }
    p.sub { color: #aaa; font-size: .85rem; margin-bottom: 24px; }
    .linha { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
    .linha b { color: #fff; }
    .ok { color: #4caf50; font-weight: 700; }
    .falha { color: #f44336; font-weight: 700; }
    .alerta { color: #ffb300; font-weight: 700; }
    code { background: #000; padding: 2px 6px; border-radius: 4px; font-size: .85rem; }
    pre { background: #000; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .78rem; white-space: pre-wrap; word-break: break-word; }
    #erro { display: none; background: #2a0f0f; border: 1px solid #f44336; }
  </style>
</head>
<body>
  <h1>🔎 Diagnóstico — carrossel "Em promoção"</h1>
  <p class="sub">Refaz, na tela, os mesmos cálculos que a página inicial faz. Tire um print desta página inteira e mande pra análise.</p>
  <div id="resultado"><div class="linha">Carregando...</div></div>
  <div class="linha" id="erro"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="./v2-firebase-config.js"></script>
  <script>
    const res = document.getElementById("resultado");
    const erroBox = document.getElementById("erro");
    const linha = (html) => { const d = document.createElement("div"); d.className = "linha"; d.innerHTML = html; res.appendChild(d); };
    const mostrarErro = (titulo, e) => {
      erroBox.style.display = "block";
      erroBox.innerHTML = `<b class="falha">${titulo}</b><pre>${(e && e.stack) || e}</pre>`;
    };

    (async () => {
      res.innerHTML = "";
      try {
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        linha(`<b>Hora do teste:</b> ${new Date().toLocaleString("pt-BR")}<br><b>Navegador:</b> ${navigator.userAgent}`);

        // ---- Config ----
        let config;
        try {
          const confSnap = await db.collection("configuracoes").doc("geral").get();
          config = confSnap.exists ? confSnap.data() : {};
          linha(`<b>Config lida do Firestore:</b> ${confSnap.exists ? '<span class="ok">documento encontrado</span>' : '<span class="falha">documento NÃO existe</span>'}<br>
            <b>mostrarPromocoes:</b> <code>${JSON.stringify(config.mostrarPromocoes)}</code><br>
            <b>qtdPromocoes:</b> <code>${JSON.stringify(config.qtdPromocoes)}</code><br>
            <b>tituloPromocoes:</b> <code>${JSON.stringify(config.tituloPromocoes)}</code>`);
        } catch (e) { mostrarErro("Falhou ao ler Configurações (configuracoes/geral):", e); return; }

        // ---- Produtos ----
        let produtos;
        try {
          const prodSnap = await db.collection("produtos").get();
          produtos = prodSnap.docs.map((d) => ({ ...d.data(), id: d.id }));
          linha(`<b>Total de produtos lidos:</b> ${produtos.length}`);
        } catch (e) { mostrarErro("Falhou ao ler a coleção Produtos:", e); return; }

        // ---- Mesmo cálculo de v2-js/store.js: ativos() e o filtro de promoção ----
        const ativos = produtos.filter((p) => p.ativo !== false);
        const promocoes = ativos.filter((p) => p.promocao);
        linha(`<b>Produtos ativos (ativo !== false):</b> ${ativos.length}<br>
          <b>Produtos ativos marcados "promocao: true":</b> <span class="${promocoes.length ? "ok" : "falha"}">${promocoes.length}</span>`);
        if (promocoes.length) {
          linha(`<b>Quais são:</b><pre>${promocoes.map((p) => `${p.id} — ${p.nome} (ativo=${p.ativo}, estoque=${p.estoque})`).join("\n")}</pre>`);
        }

        const mostrar = config.mostrarPromocoes === false ? false : true;
        const escondido = config.mostrarPromocoes === false || promocoes.length === 0;
        linha(`<b>Resultado final — a seção "Em promoção" deveria aparecer?</b><br>
          <span class="${escondido ? "falha" : "ok"}" style="font-size:1.1rem">${escondido ? "NÃO (ficaria escondida)" : "SIM (deveria aparecer)"}</span><br>
          <small>mostrarPromocoes===false? ${config.mostrarPromocoes === false} — promocoes.length===0? ${promocoes.length === 0}</small>`);

        // ---- Tenta montar um card de verdade, igual o site faz, pra pegar erro de renderização ----
        try {
          if (promocoes.length) {
            const p = promocoes[0];
            const testeHtml = `<img src="${p.imagem || ""}" alt="${p.nome}" />`;
            linha(`<b class="ok">Montagem de card de teste (1º produto em promoção): OK</b>`);
          }
        } catch (e) { mostrarErro("Falhou ao montar o card do produto em promoção:", e); return; }

        linha(`<b class="ok">Diagnóstico concluído sem erros de JavaScript.</b>`);
      } catch (e) {
        mostrarErro("Erro geral inesperado:", e);
      }
    })();
  </script>
</body>
</html>
