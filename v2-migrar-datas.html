<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migração V2 — Datas — Manejo Mix</title>
  <!-- Ferramenta da Fase 3 da migração (ver
       docs/superpowers/plans/2026-11-11-migracao-v2-fase3-dashboard-estoque.md).
       Converte `criadoEm` de Firestore Timestamp (como tudo foi gravado até
       hoje, via serverTimestamp()) para string ISO (formato que o Dashboard
       e o Estoque novos esperam — ver v2-js/db.js:178, new Date().toISOString()).
       Só mexe no campo `criadoEm`, via .update(), nunca sobrescreve o
       documento inteiro. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #D4A017; }
    p  { font-size: .9rem; color: #aaa; margin-bottom: 24px; text-align: center; max-width: 560px; }
    .botoes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    button.acao { padding: 14px 28px; background: #D4A017; color: #000; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    button.acao:disabled { opacity: .45; cursor: not-allowed; }
    #log  { margin-top: 24px; width: 100%; max-width: 560px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-size: .8rem; font-family: monospace; max-height: 400px; overflow-y: auto; }
    #login-box { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-bottom: 20px; }
    #login-box input { padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: .9rem; }
    #login-error { color: #f44336; font-size: .8rem; display: none; }
    .ok   { color: #4caf50; }
    .err  { color: #f44336; }
    .info { color: #90caf9; }
    .skip { color: #888; }
  </style>
</head>
<body>

<h1>🛠️ Migração V2 — Datas (criadoEm)</h1>
<p>Faça login com o usuário admin. O botão converte `criadoEm` de
   Timestamp pra texto (string ISO) em Pedidos e Vendas — documento que já
   estiver em texto é pulado. Pode rodar quantas vezes quiser.</p>

<div id="login-box">
  <input type="email" id="email-input" placeholder="E-mail do admin">
  <input type="password" id="senha-input" placeholder="Senha">
  <button id="login-btn">🔐 Entrar</button>
  <span id="login-error">E-mail ou senha inválidos.</span>
</div>

<div class="botoes">
  <button class="acao" id="btn-migrar" disabled>🕒 Migrar datas</button>
  <button class="acao" id="btn-verificar" disabled>🔎 Verificar</button>
</div>

<div id="log"><span class="info">Faça login para habilitar a migração.</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const log = document.getElementById("log");
const btnMigrar = document.getElementById("btn-migrar");
const btnVerificar = document.getElementById("btn-verificar");
const loginBtn = document.getElementById("login-btn");
const loginBox = document.getElementById("login-box");
const loginError = document.getElementById("login-error");

const addLog = (msg, tipo = "ok") => {
  const span = document.createElement("span");
  span.className = tipo;
  span.textContent = msg;
  log.appendChild(span);
  log.appendChild(document.createElement("br"));
  log.scrollTop = log.scrollHeight;
};

// mesma função provada em scripts/check-migracao-datas-logic.js
function precisaConverter(valor) {
  return !!(valor && typeof valor === "object" && typeof valor.toDate === "function");
}

loginBtn.addEventListener("click", () => {
  const email = document.getElementById("email-input").value.trim();
  const senha = document.getElementById("senha-input").value;
  loginError.style.display = "none";
  auth.signInWithEmailAndPassword(email, senha).catch(() => {
    loginError.style.display = "block";
  });
});

auth.onAuthStateChanged(user => {
  if (user) {
    loginBox.style.display = "none";
    btnMigrar.disabled = false;
    btnVerificar.disabled = false;
    log.innerHTML = "";
    addLog(`✔ Logado como ${user.email}. Pronto pra migrar.`, "ok");
  } else {
    loginBox.style.display = "flex";
    btnMigrar.disabled = true;
    btnVerificar.disabled = true;
  }
});

async function migrarColecao(nome) {
  let migrados = 0, pulados = 0, erros = 0;
  const snap = await db.collection(nome).get();
  for (const doc of snap.docs) {
    try {
      const valor = doc.data().criadoEm;
      if (!precisaConverter(valor)) { pulados++; continue; }
      await doc.ref.update({ criadoEm: valor.toDate().toISOString() });
      migrados++;
    } catch (e) {
      addLog(`✘ Erro em ${nome}/${doc.id} — ${e.message}`, "err");
      erros++;
    }
  }
  addLog(`▶ ${nome}: ${migrados} convertidos, ${pulados} já estavam em texto, ${erros} erros.`, "info");
}

btnMigrar.addEventListener("click", async () => {
  btnMigrar.disabled = true;
  addLog("▶ Migrando datas...", "info");
  await migrarColecao("pedidos");
  await migrarColecao("vendas");
  btnMigrar.disabled = false;
});

async function verificarColecao(nome) {
  const snap = await db.collection(nome).get();
  const aindaTimestamp = snap.docs.filter((d) => precisaConverter(d.data().criadoEm));
  addLog(`${nome}: ${snap.size} documentos, ${aindaTimestamp.length} ainda em formato antigo${aindaTimestamp.length ? " (" + aindaTimestamp.map((d) => d.id).join(", ") + ")" : ""}`, aindaTimestamp.length ? "err" : "ok");
  return aindaTimestamp.length;
}

btnVerificar.addEventListener("click", async () => {
  btnVerificar.disabled = true;
  addLog("▶ Verificando...", "info");
  const a = await verificarColecao("pedidos");
  const b = await verificarColecao("vendas");
  addLog(a + b === 0 ? "RESULTADO: OK — todas as datas já estão em string ISO." : "RESULTADO: PENDENTE — ainda há documento(s) em formato antigo.", a + b === 0 ? "ok" : "err");
  btnVerificar.disabled = false;
});
</script>
</body>
</html>
