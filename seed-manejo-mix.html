<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importar Categorias – Manejo Mix</title>
  <!-- Página de importação em lote. Por enquanto só categorias; quando
       tivermos fotos/descrições de produtos, dá pra estender esse mesmo
       arquivo com um array de produtos, igual fizemos no Burger House. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #D4A017; }
    p  { font-size: .9rem; color: #aaa; margin-bottom: 24px; text-align: center; max-width: 540px; }
    #btn { padding: 14px 36px; background: #D4A017; color: #000; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    #btn:disabled { opacity: .45; cursor: not-allowed; }
    #log  { margin-top: 24px; width: 100%; max-width: 560px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-size: .8rem; font-family: monospace; max-height: 400px; overflow-y: auto; }
    #login-box { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-bottom: 20px; }
    #login-box input { padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: .9rem; }
    #login-error { color: #f44336; font-size: .8rem; display: none; }
    .ok   { color: #4caf50; }
    .err  { color: #f44336; }
    .info { color: #90caf9; }
  </style>
</head>
<body>

<h1>🐾 Importar Categorias — Manejo Mix</h1>
<p>Faça login com o usuário admin e clique no botão pra criar as 4 categorias iniciais. Pode rodar de novo sem medo — sempre atualiza as mesmas, nunca duplica.</p>

<div id="login-box">
  <input type="email" id="email-input" placeholder="E-mail do admin">
  <input type="password" id="senha-input" placeholder="Senha">
  <button id="login-btn">🔐 Entrar</button>
  <span id="login-error">E-mail ou senha inválidos.</span>
</div>

<button id="btn" disabled>🚀 Importar Categorias</button>

<div id="log"><span class="info">Faça login para habilitar a importação.</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>

<script>
const categorias = [
  { id: "racoes",      nome: "Rações",      icone: "fa-bone",         ordem: 1 },
  { id: "petiscos",    nome: "Petiscos",    icone: "fa-cookie-bite",  ordem: 2 },
  { id: "medicamentos",nome: "Medicamentos",icone: "fa-pills",        ordem: 3 },
  { id: "acessorios",  nome: "Acessórios",  icone: "fa-bag-shopping", ordem: 4 },
];

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const log = document.getElementById("log");
const btn = document.getElementById("btn");
const loginBtn = document.getElementById("login-btn");
const loginBox = document.getElementById("login-box");
const loginError = document.getElementById("login-error");

const addLog = (msg, tipo = "ok") => {
  const span = document.createElement("span");
  span.className = tipo;
  span.textContent = msg;
  log.appendChild(span);
  log.appendChild(document.createElement("br"));
  log.scrollTop = log.scrollHeight;
};

loginBtn.addEventListener("click", () => {
  const email = document.getElementById("email-input").value.trim();
  const senha = document.getElementById("senha-input").value;
  loginError.style.display = "none";
  auth.signInWithEmailAndPassword(email, senha).catch(() => {
    loginError.style.display = "block";
  });
});

auth.onAuthStateChanged(user => {
  if (user) {
    loginBox.style.display = "none";
    btn.disabled = false;
    log.innerHTML = "";
    addLog(`✔ Logado como ${user.email}. Pronto pra importar.`, "ok");
  } else {
    loginBox.style.display = "flex";
    btn.disabled = true;
  }
});

btn.addEventListener("click", async () => {
  btn.disabled = true;
  log.innerHTML = "";
  addLog("▶ Iniciando importação...", "info");

  let ok = 0, erros = 0;

  for (const c of categorias) {
    try {
      await db.collection("categorias").doc(c.id).set(c);
      addLog(`✔ Categoria: ${c.nome}`, "ok");
      ok++;
    } catch (e) {
      addLog(`✘ Categoria: ${c.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog(`━━━ CONCLUÍDO: ${ok} categorias importadas, ${erros} erros ━━━`, erros > 0 ? "err" : "info");
  btn.disabled = false;
});
</script>
</body>
</html>
