<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importar Catálogo – Manejo Mix</title>
  <!-- Página de importação em lote. Vai crescendo conforme as categorias
       de produtos chegam (rações primeiro, depois medicamentos, etc.),
       igual fizemos no Burger House. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #D4A017; }
    p  { font-size: .9rem; color: #aaa; margin-bottom: 24px; text-align: center; max-width: 540px; }
    #btn { padding: 14px 36px; background: #D4A017; color: #000; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    #btn:disabled { opacity: .45; cursor: not-allowed; }
    #log  { margin-top: 24px; width: 100%; max-width: 560px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-size: .8rem; font-family: monospace; max-height: 400px; overflow-y: auto; }
    #login-box { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-bottom: 20px; }
    #login-box input { padding: 12px; border-radius: 6px; border: 1px solid #333; background: #1a1a1a; color: #eee; font-size: .9rem; }
    #login-error { color: #f44336; font-size: .8rem; display: none; }
    .ok   { color: #4caf50; }
    .err  { color: #f44336; }
    .info { color: #90caf9; }
  </style>
</head>
<body>

<h1>🐾 Importar Catálogo — Manejo Mix</h1>
<p>Faça login com o usuário admin e clique no botão pra criar/atualizar categorias e produtos de uma vez. Pode rodar quantas vezes quiser — sempre atualiza os mesmos itens, nunca duplica.</p>

<div id="login-box">
  <input type="email" id="email-input" placeholder="E-mail do admin">
  <input type="password" id="senha-input" placeholder="Senha">
  <button id="login-btn">🔐 Entrar</button>
  <span id="login-error">E-mail ou senha inválidos.</span>
</div>

<button id="btn" disabled>🚀 Importar Catálogo</button>

<div id="log"><span class="info">Faça login para habilitar a importação.</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>

<script>
const categorias = [
  { id: "racoes",          nome: "Rações",          icone: "fa-bone",         ordem: 1 },
  { id: "medicamentos",    nome: "Medicamentos",    icone: "fa-pills",        ordem: 2 },
  { id: "higiene-e-beleza",nome: "Higiene e Beleza",icone: "fa-shower",       ordem: 3 },
  { id: "petiscos",        nome: "Petiscos",        icone: "fa-cookie-bite", ordem: 4 },
  { id: "acessorios",      nome: "Acessórios",      icone: "fa-bag-shopping", ordem: 5 },
];

// IDs de produto são números sequenciais simples, igual nos outros
// catálogos — vai crescendo conforme as categorias chegam.
const produtos = [
  // ── RAÇÕES ───────────────────────────────────────────────────────────────
  {
    id: 1, categoria: "racoes", nome: "Origens Class Premium Cães Carne e Frango 15kg", preco: 155.19,
    imagem: "./assets/origens-class-premium.webp",
    descricao: "Ração premium para cães, sabor carne e frango, indicada para todos os portes. Pacote de 15kg.",
  },
  {
    id: 2, categoria: "racoes", nome: "Origens Class Cães Adultos Carne e Frango 10kg", preco: 118.49,
    imagem: "./assets/origens-class.webp",
    descricao: "Ração completa e balanceada para cães adultos, sabor carne e frango, com prebióticos para saúde intestinal e fórmula que favorece pelagem brilhante.",
  },
  {
    id: 3, categoria: "racoes", nome: "Ração Origens Gatos Adultos Frango 10,1kg", preco: 195.99,
    imagem: "./assets/origens-gatos-adultos.webp",
    descricao: "Ração para gatos adultos, sabor frango, com ômegas 3 e 6, biotina e zinco, sem corantes nem aromatizantes artificiais.",
  },
  {
    id: 4, categoria: "racoes", nome: "Origens Gatos Castrados Adultos Salmão 3kg", preco: 76.29,
    imagem: "./assets/origens-gatos-castrados.webp",
    descricao: "Ração para gatos castrados, sabor salmão, com controle do pH urinário e prebióticos para boa digestão.",
  },
  {
    // Também existe a versão 20kg (R$204,99) — deixei de fora por ora pra
    // manter o catálogo enxuto; fácil de adicionar depois.
    id: 5, categoria: "racoes", nome: "Ração Golden Adulto Frango e Carne 15kg", preco: 159.99,
    imagem: "./assets/golden-adulto.webp",
    descricao: "Ração para cães adultos, sabor frango e carne, blend de proteínas para músculos mais fortes e redução do odor das fezes.",
  },
  {
    id: 6, categoria: "racoes", nome: "Ração Golden Filhotes Frango 10kg", preco: 159.99,
    imagem: "./assets/golden-filhotes.webp",
    descricao: "Ração para filhotes de raças pequenas, sabor frango com arroz.",
  },
  {
    id: 7, categoria: "racoes", nome: "Ração Premier Gatos Adultos Salmão 10kg", preco: 184.50,
    imagem: "./assets/premier-gatos-adultos.webp",
    descricao: "Ração para gatos adultos, sabor salmão, com controle do pH urinário, alta digestibilidade e prebióticos.",
  },
  {
    id: 8, categoria: "racoes", nome: "Ração Whiskas Gatos Adultos Carne 10kg", preco: 178.99,
    imagem: "./assets/whiskas-gatos-adultos-carne.png",
    descricao: "Ração premium para gatos adultos, sabor carne, nuggets crocantes com recheio macio e prebióticos.",
  },
  {
    id: 9, categoria: "racoes", nome: "Ração Royal Canin Mini Adulto 8kg", preco: 274.65,
    imagem: "./assets/royal-canin-mini-adulto.webp",
    descricao: "Ração super premium para cães de porte pequeno (1 a 10kg), ajuda a limitar o acúmulo de placa bacteriana e melhora a pelagem.",
  },
  {
    id: 10, categoria: "racoes", nome: "Sachê Whiskas Ração Úmida Carne ao Molho 85g", preco: 19.99,
    imagem: "./assets/sache-whiskas.png",
    descricao: "Ração úmida em sachê para gatos adultos, sabor carne ao molho, sem conservantes nem corantes artificiais.",
  },

  // ── MEDICAMENTOS ─────────────────────────────────────────────────────────
  {
    id: 11, categoria: "medicamentos", nome: "Vermífugo Drontal Plus Cães", preco: 45.00,
    imagem: "./assets/vermifigo-drontal-plus-caes.jpeg",
    descricao: "Vermífugo de amplo espectro para cães, com sabor agradável e sem necessidade de jejum prévio. Indicado para uso a cada três meses em cães adultos.",
  },
  {
    id: 12, categoria: "medicamentos", nome: "Vermífugo Profender Gatos", preco: 59.49,
    imagem: "./assets/profender-spotOn.jpg",
    descricao: "Vermífugo em pipeta (spot-on) para gatos de 2,5 a 5kg, combate vermes chatos e redondos em forma adulta e larvas.",
  },
  {
    id: 13, categoria: "medicamentos", nome: "Antipulgas Frontline Cães 10-20kg", preco: 46.99,
    imagem: "./assets/antipulgas-frontline-caes-10-20kg.webp",
    descricao: "Antipulgas e carrapaticida em pipeta para cães de 10 a 20kg, proteção por um mês contra pulgas, carrapatos e piolhos mastigadores.",
  },
  {
    id: 14, categoria: "medicamentos", nome: "Antipulgas Bravecto Cães 10-20kg", preco: 182.64,
    imagem: "./assets/bravecto-500mg-caes-10-20kg.png",
    descricao: "Antipulgas e carrapaticida em comprimido mastigável para cães de 10 a 20kg, elimina parasitas em até 12h e protege por 12 semanas.",
  },
  {
    id: 15, categoria: "medicamentos", nome: "Vitamina Vetnil Cães", preco: 50.14,
    imagem: "./assets/vitamina-vetn-caes.webp",
    descricao: "Suplemento vitamínico (vitamina C) para cães, gatos e outros pets — frasco de 30ml, atua como neutralizador de radicais livres.",
  },
  {
    id: 16, categoria: "medicamentos", nome: "Soro Fisiológico Pet 500ml", preco: 10.24,
    imagem: "./assets/soro-fisiologico.webp",
    descricao: "Soro fisiológico cloreto de sódio 0,9%, 500ml, indicado para limpeza de olhos, ouvidos, feridas e lavagem nasal de pets.",
  },
];

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const log = document.getElementById("log");
const btn = document.getElementById("btn");
const loginBtn = document.getElementById("login-btn");
const loginBox = document.getElementById("login-box");
const loginError = document.getElementById("login-error");

const addLog = (msg, tipo = "ok") => {
  const span = document.createElement("span");
  span.className = tipo;
  span.textContent = msg;
  log.appendChild(span);
  log.appendChild(document.createElement("br"));
  log.scrollTop = log.scrollHeight;
};

loginBtn.addEventListener("click", () => {
  const email = document.getElementById("email-input").value.trim();
  const senha = document.getElementById("senha-input").value;
  loginError.style.display = "none";
  auth.signInWithEmailAndPassword(email, senha).catch(() => {
    loginError.style.display = "block";
  });
});

auth.onAuthStateChanged(user => {
  if (user) {
    loginBox.style.display = "none";
    btn.disabled = false;
    log.innerHTML = "";
    addLog(`✔ Logado como ${user.email}. Pronto pra importar.`, "ok");
  } else {
    loginBox.style.display = "flex";
    btn.disabled = true;
  }
});

btn.addEventListener("click", async () => {
  btn.disabled = true;
  log.innerHTML = "";
  addLog("▶ Iniciando importação...", "info");

  let ok = 0, erros = 0;

  for (const c of categorias) {
    try {
      await db.collection("categorias").doc(c.id).set(c);
      addLog(`✔ Categoria: ${c.nome}`, "ok");
      ok++;
    } catch (e) {
      addLog(`✘ Categoria: ${c.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog("▶ Importando produtos...", "info");
  for (const p of produtos) {
    try {
      await db.collection("produtos").doc(String(p.id)).set({
        ...p,
        codigoBarras: null,
        ativo: true,
        destaque: false,
        entrega: true,
        variacoes: [],
        adicionaisGrupos: [],
        criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      });
      addLog(`✔ [${p.id}] ${p.nome}`, "ok");
      ok++;
    } catch (e) {
      addLog(`✘ [${p.id}] ${p.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog(`━━━ CONCLUÍDO: ${ok} itens importados, ${erros} erros ━━━`, erros > 0 ? "err" : "info");
  btn.disabled = false;
});
</script>
</body>
</html>
