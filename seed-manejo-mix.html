firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const log = document.getElementById("log");
const btn = document.getElementById("btn");
const loginBtn = document.getElementById("login-btn");
const loginBox = document.getElementById("login-box");
const loginError = document.getElementById("login-error");

const addLog = (msg, tipo = "ok") => {
  const span = document.createElement("span");
  span.className = tipo;
  span.textContent = msg;
  log.appendChild(span);
  log.appendChild(document.createElement("br"));
  log.scrollTop = log.scrollHeight;
};

loginBtn.addEventListener("click", () => {
  const email = document.getElementById("email-input").value.trim();
  const senha = document.getElementById("senha-input").value;
  loginError.style.display = "none";
  auth.signInWithEmailAndPassword(email, senha).catch(() => {
    loginError.style.display = "block";
  });
});

auth.onAuthStateChanged(user => {
  if (user) {
    loginBox.style.display = "none";
    btn.disabled = false;
    log.innerHTML = "";
    addLog(`✔ Logado como ${user.email}. Pronto pra importar.`, "ok");
  } else {
    loginBox.style.display = "flex";
    btn.disabled = true;
  }
});

btn.addEventListener("click", async () => {
  btn.disabled = true;
  log.innerHTML = "";
  addLog("▶ Iniciando importação...", "info");

  let ok = 0, erros = 0;

  addLog("▶ Apagando produtos antigos...", "info");
  for (const id of produtosParaExcluir) {
    try {
      await db.collection("produtos").doc(String(id)).delete();
      addLog(`✔ Apagado: produto [${id}]`, "ok");
    } catch (e) {
      addLog(`✘ Erro ao apagar [${id}] — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  for (const c of categorias) {
    try {
      await db.collection("categorias").doc(c.id).set(c, { merge: true });
      addLog(`✔ Categoria: ${c.nome}`, "ok");
      ok++;
    } catch (e) {
      addLog(`✘ Categoria: ${c.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog("▶ Importando produtos...", "info");
  for (const p of produtos) {
    try {
      // O catálogo (nome/categoria/ordem/preco/imagem/descricao) é sempre
      // atualizado — é o que esta ferramenta existe pra manter. Estoque,
      // código de barras, ativo/destaque e variações são operacionais (quem
      // manda nisso é o admin, ao vivo) — só entram no primeiro cadastro,
      // nunca são revertidos num reimport.
      const ref = db.collection("produtos").doc(String(p.id));
      const atual = await ref.get();
      const dadosOperacionais = atual.exists ? {} : {
        codigoBarras: null,
        codigo: null,
        estoque: 0,
        estoqueMinimo: null,
        custo: null,
        precoAntigo: null,
        ativo: true,
        destaque: false,
        entrega: true,
        variacoes: [],
        adicionaisGrupos: [],
        criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      };
      await ref.set({ ...p, ...dadosOperacionais }, { merge: true });
      addLog(`✔ [${p.id}] ${p.nome}`, "ok");
      ok++;
    } catch (e) {
      addLog(`✘ [${p.id}] ${p.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog(`━━━ CONCLUÍDO: ${ok} itens importados, ${erros} erros ━━━`, erros > 0 ? "err" : "info");
  btn.disabled = false;
});
</script>
</body>
</html>
